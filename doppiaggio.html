<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lees Assistent</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #000; color: #FFF; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        /* Camera preview: alleen zichtbaar in boek-modus */
        video {
            display: none;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            border: 3px solid #555;
            margin-top: 15px;
            background: #111;
        }
        video.actief { display: block; }

        .menu-knop {
            width: 100%; max-width: 400px; padding: 40px 20px;
            margin: 15px 0; font-size: 1.8rem; font-weight: bold;
            border-radius: 20px; border: 4px solid #FFF; cursor: pointer;
        }
        #btn-film { background: #E6B800; color: #000; } /* Geel voor film */
        #btn-boek { background: #0080FF; color: #FFF; } /* Blauw voor boek */
        
        #status-scherm {
            width: 100%; max-width: 400px; margin-top: 20px; text-align: center;
        }

        /* Luister-indicator (rood bolletje dat pulseert tijdens opname) */
        #luister-indicator {
            display: none; width: 14px; height: 14px; border-radius: 50%;
            background: #FF3333; margin: 10px auto 0; 
            animation: puls 1.2s infinite ease-in-out;
        }
        #luister-indicator.actief { display: block; }
        @keyframes puls { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

        #wissel-knop {
            display: none; margin-top: 15px; padding: 10px 18px;
            font-size: 1rem; border-radius: 10px; border: 2px solid #FFF;
            background: #222; color: #FFF; cursor: pointer;
        }
        #wissel-knop.actief { display: inline-block; }

        #tekst-origineel {
            font-size: 1.2rem; color: #999; font-style: italic;
            margin-top: 20px; min-height: 1.6rem;
        }
        #tekst-vak { 
            font-size: 2.2rem; color: #00FF00; margin-top: 10px; 
            background: #111; padding: 20px; border-radius: 10px;
            min-height: 100px;
        }
        .stop-knop {
            background: #FF0000; color: #FFF; padding: 20px;
            margin-top: 30px; display: none; font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1 id="titel">Kies uw modus:</h1>

    <button id="btn-film" class="menu-knop" onclick="startModus('film')">
        🎬 ONDERTITELING<br><small>(Hoort & vertaalt live)</small>
    </button>
    
    <button id="btn-boek" class="menu-knop" onclick="startModus('boek')">
        📖 BOEK PAGINA<br><small>(Nauwkeurig voorlezen)</small>
    </button>

    <div id="status-scherm">
        <div id="status-bericht"></div>
        <div id="luister-indicator"></div>
        <button id="wissel-knop" onclick="wisselTaal()">🔄 IT → NL</button>

        <video id="camera" autoplay playsinline muted></video>

        <div id="tekst-origineel"></div>
        <div id="tekst-vak">Wachtend op keuze...</div>
        <button id="btn-stop" class="menu-knop stop-knop" onclick="stopAlles()">STOP & TERUG</button>
    </div>

    <script>
        const video = document.getElementById('camera');
        const tekstVak = document.getElementById('tekst-vak');
        const tekstOrigineel = document.getElementById('tekst-origineel');
        const statusBericht = document.getElementById('status-bericht');
        const luisterIndicator = document.getElementById('luister-indicator');
        const wisselKnop = document.getElementById('wissel-knop');
        const stopBtn = document.getElementById('btn-stop');

        let scanInterval;
        let huidigeModus = "";

        // --- Ondertiteling: spraakherkenning + vertaling ---
        let herkenning = null;
        let luisterActief = false;
        let bronTaal = 'it-IT';   // wat er gesproken wordt op tv
        let doelTaalPaar = 'it|nl'; // MyMemory taalpaar: bron|doel

        function wisselTaal() {
            if (bronTaal === 'it-IT') {
                bronTaal = 'nl-NL';
                doelTaalPaar = 'nl|it';
                wisselKnop.innerText = '🔄 NL → IT';
            } else {
                bronTaal = 'it-IT';
                doelTaalPaar = 'it|nl';
                wisselKnop.innerText = '🔄 IT → NL';
            }
            tekstOrigineel.innerText = '';
            tekstVak.innerText = 'Taal gewisseld — luistert...';
            if (luisterActief && herkenning) {
                herkenning.stop(); // onend herstart automatisch met nieuwe taal
            }
        }

        function startModus(modus) {
            huidigeModus = modus;
            document.getElementById('btn-film').style.display = 'none';
            document.getElementById('btn-boek').style.display = 'none';
            document.getElementById('titel').style.display = 'none';
            stopBtn.style.display = 'block';

            if (modus === 'film') {
                statusBericht.innerText = "Modus: Ondertiteling (leg de telefoon bij de tv-speaker)";
                wisselKnop.classList.add('actief');
                startOndertiteling();
            } else {
                statusBericht.innerText = "Modus: Boek (Houd stil boven pagina)";
                video.classList.add('actief');
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                    .then(stream => {
                        video.srcObject = stream;
                        // Scan elke 5 seconden voor een hele pagina
                        scanInterval = setInterval(() => scanBoekTekst(), 5000);
                    })
                    .catch(() => {
                        statusBericht.innerText = "Kon de camera niet starten.";
                    });
            }
        }

        // --- Boek-modus: ongewijzigd (camera + OCR + Nederlands voorlezen) ---
        async function scanBoekTekst() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            const result = await Tesseract.recognize(canvas, 'nld');
            let gevondenTekst = result.data.text.trim();

            if (gevondenTekst.length > 5) {
                tekstVak.innerText = gevondenTekst;
                spreekUit(gevondenTekst);
            }
        }

        function spreekUit(tekst) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(tekst);
            utterance.lang = 'nl-NL';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // --- Ondertiteling-modus: microfoon horen, live vertalen, tonen ---
        function startOndertiteling() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                statusBericht.innerText = "Spraakherkenning wordt niet ondersteund in deze browser.";
                return;
            }
            luisterActief = true;
            herkenning = new SpeechRec();
            herkenning.continuous = true;
            herkenning.interimResults = true;
            herkenning.lang = bronTaal;

            herkenning.onstart = () => luisterIndicator.classList.add('actief');
            herkenning.onaudiostart = () => luisterIndicator.classList.add('actief');

            herkenning.onresult = (event) => {
                let interim = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const stuk = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        vertaalEnToon(stuk.trim());
                    } else {
                        interim += stuk;
                    }
                }
                if (interim) tekstOrigineel.innerText = interim;
            };

            herkenning.onerror = (event) => {
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    statusBericht.innerText = "Geen toestemming voor de microfoon.";
                    luisterActief = false;
                }
                // andere fouten (bv. 'no-speech') negeren we: onend herstart vanzelf
            };

            herkenning.onend = () => {
                luisterIndicator.classList.remove('actief');
                if (luisterActief) {
                    // Android stopt herkenning vaak na een stilte — meteen herstarten
                    try { herkenning.lang = bronTaal; herkenning.start(); } catch (e) {}
                }
            };

            herkenning.start();
        }

        async function vertaalEnToon(origineleTekst) {
            if (!origineleTekst) return;
            tekstOrigineel.innerText = origineleTekst;
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(origineleTekst)}&langpair=${doelTaalPaar}`;
                const respons = await fetch(url);
                const data = await respons.json();
                const vertaling = data && data.responseData && data.responseData.translatedText;
                tekstVak.innerText = vertaling || origineleTekst;
            } catch (e) {
                tekstVak.innerText = origineleTekst + " (vertaling mislukt)";
            }
        }

        function stopAlles() {
            clearInterval(scanInterval);
            window.speechSynthesis.cancel();
            if (herkenning) {
                luisterActief = false;
                try { herkenning.stop(); } catch (e) {}
            }
            location.reload(); // Herlaad de pagina om terug naar menu te gaan
        }
    </script>
</body>
</html>
