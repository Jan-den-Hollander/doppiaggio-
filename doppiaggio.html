<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lees Assistent</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #000; color: #FFF; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        /* Camera preview: zichtbaar zodra een modus gestart is */
        video {
            display: none;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            border: 3px solid #555;
            margin-top: 15px;
            background: #111;
        }
        video.actief { display: block; }

        /* Geeft aan welk deel van het beeld gescand wordt (film = onderste strook) */
        .scan-kader {
            position: relative;
            width: 100%;
            max-width: 400px;
        }
        .scan-strook {
            display: none;
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 40%;
            border-top: 3px dashed #E6B800;
            box-sizing: border-box;
            pointer-events: none;
        }
        .scan-strook.actief { display: block; }
        
        .menu-knop {
            width: 100%; max-width: 400px; padding: 40px 20px;
            margin: 15px 0; font-size: 1.8rem; font-weight: bold;
            border-radius: 20px; border: 4px solid #FFF; cursor: pointer;
        }
        #btn-film { background: #E6B800; color: #000; } /* Geel voor film */
        #btn-boek { background: #0080FF; color: #FFF; } /* Blauw voor boek */
        
        #status-scherm {
            width: 100%; margin-top: 20px; text-align: center;
        }
        #tekst-vak { 
            font-size: 2.2rem; color: #00FF00; margin-top: 20px; 
            background: #111; padding: 20px; border-radius: 10px;
            min-height: 100px;
        }
        .stop-knop {
            background: #FF0000; color: #FFF; padding: 20px;
            margin-top: 30px; display: none; font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1 id="titel">Kies uw modus:</h1>

    <button id="btn-film" class="menu-knop" onclick="startModus('film')">
        🎬 ONDERTITELING<br><small>(Snel & Vertalen)</small>
    </button>
    
    <button id="btn-boek" class="menu-knop" onclick="startModus('boek')">
        📖 BOEK PAGINA<br><small>(Nauwkeurig voorlezen)</small>
    </button>

    <div id="status-scherm">
        <div id="status-bericht"></div>

        <div class="scan-kader">
            <video id="camera" autoplay playsinline muted></video>
            <div id="scan-strook" class="scan-strook"></div>
        </div>

        <div id="tekst-vak">Wachtend op keuze...</div>
        <button id="btn-stop" class="menu-knop stop-knop" onclick="stopAlles()">STOP & TERUG</button>
    </div>

    <script>
        const video = document.getElementById('camera');
        const scanStrook = document.getElementById('scan-strook');
        const tekstVak = document.getElementById('tekst-vak');
        const statusBericht = document.getElementById('status-bericht');
        const stopBtn = document.getElementById('btn-stop');
        let scanInterval;
        let huidigeModus = "";

        // Camera direct starten bij openen (achtercamera)
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; });

        function startModus(modus) {
            huidigeModus = modus;
            document.getElementById('btn-film').style.display = 'none';
            document.getElementById('btn-boek').style.display = 'none';
            document.getElementById('titel').style.display = 'none';
            stopBtn.style.display = 'block';

            // Camera zichtbaar maken zodat je kunt zien wat je richt
            video.classList.add('actief');

            if (modus === 'film') {
                statusBericht.innerText = "Modus: Film (Richt op TV — tekst in gestippeld vak = wat gescand wordt)";
                scanStrook.classList.add('actief');
                // Scan elke 2 seconden voor ondertitels
                scanInterval = setInterval(() => scanTekst(true), 2000);
            } else {
                statusBericht.innerText = "Modus: Boek (Houd stil boven pagina)";
                scanStrook.classList.remove('actief');
                // Scan elke 5 seconden voor een hele pagina
                scanInterval = setInterval(() => scanTekst(false), 5000);
            }
        }

        async function scanTekst(isVertalen) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // Als het film is, kijken we alleen naar de onderste helft van het beeld
            if (isVertalen) {
                ctx.drawImage(video, 0, video.videoHeight*0.6, video.videoWidth, video.videoHeight*0.4, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.drawImage(video, 0, 0);
            }

            const result = await Tesseract.recognize(canvas, 'nld');
            let gevondenTekst = result.data.text.trim();

            if (gevondenTekst.length > 5) {
                tekstVak.innerText = gevondenTekst;
                spreekUit(gevondenTekst, isVertalen);
            }
        }

        function spreekUit(tekst, naarItaliaans) {
            window.speechSynthesis.cancel(); // Stop oude tekst
            const utterance = new SpeechSynthesisUtterance(tekst);
            
            // Keuze: voorlezen in NL (boek) of simulatie vertaling IT (film)
            utterance.lang = naarItaliaans ? 'it-IT' : 'nl-NL';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function stopAlles() {
            clearInterval(scanInterval);
            window.speechSynthesis.cancel();
            location.reload(); // Herlaad de pagina om terug naar menu te gaan
        }
    </script>
</body>
</html>
